<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="100%">
  <style>
    @keyframes traceFlow{0%{stroke-dashoffset:400}100%{stroke-dashoffset:0}}
    @keyframes traceFlow2{0%{stroke-dashoffset:300}100%{stroke-dashoffset:0}}
    @keyframes pulseGlow{0%,100%{opacity:0.4}50%{opacity:1}}
    .trace-anim{stroke-dasharray:400;stroke-dashoffset:0;animation:traceFlow 2s ease-out}
    .trace-anim2{stroke-dasharray:300;stroke-dashoffset:0;animation:traceFlow2 2.5s ease-out}
    .pulse-dot{animation:pulseGlow 1.5s ease-in-out infinite}
    .pulse-dot2{animation:pulseGlow 1.8s ease-in-out infinite}
  </style>
  <defs>
    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4365">
        <animate attributeName="stop-color" values="#FF4365;#ff6b9d;#00ff88;#FF4365" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00ff88">
        <animate attributeName="stop-color" values="#00ff88;#FF4365;#ff6b9d;#00ff88" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <pattern id="pcbGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1a1a2e" stroke-width="0.4"/>
      <circle cx="0" cy="0" r="1" fill="#1a1a2e"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="1000" height="380" fill="#0d0d1a"/>
  <rect width="1000" height="380" fill="url(#pcbGrid)" opacity="0.35"/>
  <rect x="0" y="378" width="1000" height="2" fill="#FF4365" opacity="0.15" filter="url(#glowPink)"/>
  
  <!-- Left traces -->
  <g filter="url(#glowPink)">
    <path d="M 0 80 L 45 80 Q 65 80 75 100 L 110 100 Q 120 100 130 120 L 180 120" fill="none" stroke="#FF4365" stroke-width="1.8" class="trace-anim"/>
    <circle cx="180" cy="120" r="3.5" fill="#FF4365"/>
    <path d="M 0 120 L 30 120 Q 50 120 55 140 L 95 140 Q 105 140 115 160 L 155 160" fill="none" stroke="#FF4365" stroke-width="1.2" opacity="0.45" class="trace-anim2"/>
  </g>
  
  <!-- Right traces -->
  <g filter="url(#glowGreen)">
    <path d="M 1000 280 L 955 280 Q 935 280 925 260 L 890 260 Q 880 260 870 240 L 820 240" fill="none" stroke="#00ff88" stroke-width="1.8" class="trace-anim"/>
    <circle cx="820" cy="240" r="3.5" fill="#00ff88"/>
    <path d="M 1000 240 L 970 240 Q 950 240 945 220 L 905 220 Q 895 220 885 200 L 845 200" fill="none" stroke="#00ff88" stroke-width="1.2" opacity="0.45" class="trace-anim2"/>
  </g>
  
  <!-- Feeder traces -->
  <g>
    <path d="M 230 120 L 290 115 L 330 130 L 390 130 L 440 135 L 480 138" fill="none" stroke="#FF4365" stroke-width="1.3" opacity="0.4" filter="url(#glowPink)" class="trace-anim"/>
    <path d="M 770 240 L 710 235 L 670 220 L 610 220 L 560 215 L 520 212" fill="none" stroke="#00ff88" stroke-width="1.3" opacity="0.4" filter="url(#glowGreen)" class="trace-anim"/>
    <path d="M 0 30 L 40 30 Q 60 30 70 50 L 110 50 Q 120 50 130 70 L 170 70" fill="none" stroke="#FF4365" stroke-width="1" opacity="0.3" class="trace-anim"/>
    <path d="M 1000 340 L 950 340 Q 930 340 920 320 L 880 320 Q 870 320 860 300 L 820 300" fill="none" stroke="#00ff88" stroke-width="1" opacity="0.3" class="trace-anim"/>
  </g>
  
  <!-- Pulse dots -->
  <circle cx="140" cy="100" r="3" fill="#FF4365" filter="url(#glowPink)"><animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite"/></circle>
  <circle cx="360" cy="125" r="3" fill="#FF4365" filter="url(#glowPink)"><animate attributeName="opacity" values="0;1;0" dur="1.5s" begin="0.4s" repeatCount="indefinite"/></circle>
  <circle cx="640" cy="225" r="3" fill="#00ff88" filter="url(#glowGreen)"><animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite"/></circle>
  
  <!-- Strawberry core -->
  <g transform="translate(500,185)">
    <path d="M 0 -48 Q -44 -42 -55 0 Q -60 32 -38 60 Q -16 82 0 94" fill="none" stroke="#FF4365" stroke-width="3" filter="url(#glowPink)" class="trace-anim"/>
    <path d="M 0 -48 Q 44 -42 55 0 Q 60 32 38 60 Q 16 82 0 94" fill="none" stroke="#FF4365" stroke-width="3" filter="url(#glowPink)" class="trace-anim"/>
    <path d="M 0 -36 Q -26 -32 -33 0 Q -36 22 -24 45 Q -12 62 0 74" fill="none" stroke="#ff6b9d" stroke-width="1.5" opacity="0.5" class="trace-anim2"/>
    <path d="M 0 -36 Q 26 -32 33 0 Q 36 22 24 45 Q 12 62 0 74" fill="none" stroke="#ff6b9d" stroke-width="1.5" opacity="0.5" class="trace-anim2"/>
    <!-- Seeds -->
    <circle cx="-16" cy="10" r="3" fill="#FF4365" filter="url(#glowPink)"/>
    <circle cx="16" cy="10" r="3" fill="#FF4365" filter="url(#glowPink)"/>
    <circle cx="-24" cy="28" r="2.5" fill="#FF4365" filter="url(#glowPink)"/>
    <circle cx="24" cy="28" r="2.5" fill="#FF4365" filter="url(#glowPink)"/>
    <circle cx="-12" cy="40" r="2.5" fill="#FF4365" filter="url(#glowPink)"/>
    <circle cx="12" cy="40" r="2.5" fill="#FF4365" filter="url(#glowPink)"/>
    <circle cx="-20" cy="56" r="2" fill="#FF4365" filter="url(#glowPink)"/>
    <circle cx="20" cy="56" r="2" fill="#FF4365" filter="url(#glowPink)"/>
    <circle cx="0" cy="24" r="3" fill="#FF4365" filter="url(#glowPink)"/>
    <circle cx="0" cy="52" r="2.5" fill="#FF4365" filter="url(#glowPink)"/>
    <!-- Leaves -->
    <path d="M 0 -48 Q -18 -66 -28 -72 Q -22 -60 -8 -52" fill="none" stroke="#00ff88" stroke-width="2.2" filter="url(#glowGreen)" class="trace-anim2"/>
    <path d="M 0 -48 Q 18 -66 28 -72 Q 22 -60 8 -52" fill="none" stroke="#00ff88" stroke-width="2.2" filter="url(#glowGreen)" class="trace-anim2"/>
    <path d="M 0 -48 Q 0 -72 0 -78 Q 5 -64 0 -52" fill="none" stroke="#00ff88" stroke-width="1.8" filter="url(#glowGreen)" class="trace-anim2"/>
    <!-- Gear -->
    <g transform="translate(-38,-66)" opacity="0.2">
      <circle cx="0" cy="0" r="9" fill="none" stroke="#00ff88" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="3" fill="#00ff88"/>
      <line x1="0" y1="-11" x2="0" y2="-15" stroke="#00ff88" stroke-width="1.5"/>
      <line x1="0" y1="11" x2="0" y2="15" stroke="#00ff88" stroke-width="1.5"/>
      <line x1="-11" y1="0" x2="-15" y2="0" stroke="#00ff88" stroke-width="1.5"/>
      <line x1="11" y1="0" x2="15" y2="0" stroke="#00ff88" stroke-width="1.5"/>
    </g>
  </g>
  
  <!-- Title -->
  <text x="500" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="52" font-weight="800" fill="url(#textGrad)" letter-spacing="0.5">Hi, I'm Katha ⚡</text>
  
  <!-- Subtitle -->
  <text x="500" y="332" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#8890b0" letter-spacing="3.5">She/Her &nbsp;&middot;&nbsp; TEC Costa Rica 🇨🇷</text>
  
  <!-- Tagline -->
  <text x="500" y="360" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#556080" letter-spacing="5">MECHATRONICS &middot; CODE &middot; STRAWBERRIES 🍓</text>
</svg>
